<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SYMBY PICK</title>
  <style>
    :root {
      --bg: #050505;
      --text: #f4f4f4;
      --muted: #8a8a8a;
      --gold: #c9a227;
      --red: #c41e3a;
      --line: rgba(201,162,39,.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: "Bahnschrift", "Agency FB", "Oswald", "Arial Narrow", sans-serif; min-height: 100%; }
    body {
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(196,30,58,.16), transparent 50%),
        linear-gradient(#050505, #0a0a0c);
      letter-spacing: .08em;
    }
    .wrap { max-width: 430px; margin: 0 auto; padding: 28px 22px 64px; }
    header { text-align: center; }
    .logo { width: 210px; max-width: 70%; height: auto; margin: 8px auto 6px; display: block; }
    .pick-word {
      font-size: 28px; font-weight: 600; letter-spacing: .42em;
      color: #fff; text-shadow: 0 0 18px rgba(201,162,39,.35);
      margin-bottom: 28px;
    }
    .langs { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; font-size: 13px; }
    .langs button { background: none; border: 0; color: var(--muted); cursor: pointer; letter-spacing: 0; }
    .langs button.on { color: var(--gold); }
    .screen { display: none; animation: in .35s ease; }
    .screen.on { display: block; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    h2 { font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .28em; text-align: center; margin-bottom: 18px; text-transform: uppercase; }
    .stack { display: flex; flex-direction: column; gap: 18px; align-items: center; }
    .choice {
      background: none; border: 0; border-bottom: 1px solid var(--line);
      color: #fff; font: inherit; font-size: 22px; letter-spacing: .32em;
      padding: 10px 8px 8px; cursor: pointer; width: min(260px, 80%);
      text-transform: uppercase;
    }
    .choice:hover, .choice.on { color: var(--gold); border-color: var(--gold); }
    .toggle {
      margin-top: 28px; display: flex; justify-content: center; gap: 0; color: var(--muted); font-size: 13px;
    }
    .toggle button {
      background: none; border: 0; color: inherit; font: inherit; letter-spacing: .2em;
      padding: 8px 14px; cursor: pointer; text-transform: uppercase;
    }
    .toggle button.on { color: #fff; }
    .toggle span { color: var(--red); align-self: center; }
    .crumbs { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .18em; margin-bottom: 20px; text-transform: uppercase; }
    .crumbs button { background: none; border: 0; color: var(--gold); font: inherit; cursor: pointer; letter-spacing: inherit; }
    .grid3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .tile {
      background: none; border: 0; color: #fff; font: inherit; font-size: 20px;
      letter-spacing: .24em; padding: 16px 0; cursor: pointer; text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }
    .tile small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .16em; margin-top: 6px; }
    .sortbar { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 8px 0 22px; }
    .sortbar button {
      background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px;
      letter-spacing: .16em; cursor: pointer; text-transform: uppercase;
    }
    .sortbar button.on { color: var(--gold); }
    .card { padding: 22px 0 26px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .card .name { font-size: 13px; letter-spacing: .2em; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .card .ticker { font-size: 20px; letter-spacing: .18em; }
    .price { font-size: 42px; letter-spacing: .04em; font-variant-numeric: tabular-nums; margin: 10px 0 6px; }
    .rets { color: var(--muted); font-size: 12px; letter-spacing: .16em; }
    .up { color: #3dba6a; } .down { color: #e25555; }
    .fund { margin-top: 16px; }
    .fund h3 { font-size: 11px; letter-spacing: .22em; color: var(--gold); font-weight: 500; margin-bottom: 10px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; font-size: 13px; letter-spacing: .12em; }
    .cols span { color: var(--muted); display: block; font-size: 10px; margin-bottom: 3px; }
    .alt { margin-top: 14px; color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; letter-spacing: .14em; line-height: 1.6; }
    .note { margin-top: 28px; text-align: center; color: #555; font-size: 10px; letter-spacing: .12em; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="langs" id="langs"></div>
  <div class="wrap">
    <header>
      <img class="logo" src="logo.jpg" alt="SYMBY" />
      <div class="pick-word">PICK</div>
    </header>

    <section id="s-region" class="screen on">
      <h2 id="t-region">Trh</h2>
      <div class="stack">
        <button class="choice" data-region="USA">USA</button>
        <button class="choice" data-region="EU">Evropa</button>
        <button class="choice" data-region="UK">UK</button>
      </div>
      <div class="toggle">
        <button id="mode-hq">Sídlo</button><span>|</span><button id="mode-ex" class="on">Burza</button>
      </div>
    </section>

    <section id="s-pe" class="screen">
      <div class="crumbs"><button data-back="region"></button></div>
      <h2>P/E</h2>
      <div class="grid3">
        <button class="tile" data-pe="0-10">0–10<small>value</small></button>
        <button class="tile" data-pe="10-20">10–20<small>fair</small></button>
        <button class="tile" data-pe="20-30">20–30<small>growth</small></button>
      </div>
    </section>

    <section id="s-sec" class="screen">
      <div class="crumbs"><button data-back="pe"></button></div>
      <h2 id="t-sec">Sektor</h2>
      <div class="stack" id="sectors"></div>
    </section>

    <section id="s-pick" class="screen">
      <div class="crumbs"><button data-back="sec"></button></div>
      <div class="sortbar" id="sortbar"></div>
      <div id="picks"></div>
      <p class="note">Cena, týden a měsíc: eToro. Rok jen když ho dá TradingView, jinak měsíc. P/E: TV. Není investiční doporučení.</p>
    </section>
  </div>

const SECTORS = {
  USA: ["Technology","Financials","Energy","Healthcare","Industrials"],
  EU: ["Technology","Financials","Energy","Healthcare","Industrials","Autos"],
  UK: ["Technology","Financials","Energy","Healthcare","Industrials"]
};

const state = { region:null, mode:"exchange", pe:null, sector:null, sort:"pe", dir:1 };

function t(k){ return T[lang][k]; }
function fmt(n, d=1){ return n==null || n==="—" ? "—" : Number(n).toLocaleString("cs-CZ", {maximumFractionDigits:d}); }
function pct(n){ if(n==null) return "—"; const s = (n>=0?"+":"") + n.toFixed(1) + " %"; return `<b class="${n>=0?"up":"down"}">${s}</b>`; }
function peOk(pe, band){
  if(pe==null) return false;
  const [a,b] = band.split("-").map(Number);
  return pe >= a && pe <= b;
}
function matchRegion(x){
  const key = state.mode === "hq" ? x.hq : x.exchange;
  return key === state.region;
}
function filtered(){
  return UNI.filter(x => matchRegion(x) && peOk(x.pe, state.pe) && x.sector === state.sector);
}
function sortRows(rows){
  const k = state.sort;
  return [...rows].sort((a,b) => {
    const av = a[k], bv = b[k];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    return (av - bv) * state.dir;
  });
}

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById("s-"+id).classList.add("on");
}
function crumbs(el, extra){
  const map = {USA:"USA", EU: lang==="cs"?"Evropa":"Europe", UK:"UK"};
  const bits = [map[state.region], state.mode==="hq"?t("hq"):t("ex"), state.pe && ("P/E "+state.pe), state.sector].filter(Boolean);
  el.querySelector("[data-back]").textContent = t("back") + " · " + bits.join(" · ") + (extra||"");
}

function renderLangs(){
  document.getElementById("langs").innerHTML = ["cs","en"].map(l =>
    `<button class="${l===lang?"on":""}" data-lang="${l}">${l==="cs"?"🇨🇿 CS":"🇬🇧 EN"}</button>`
  ).join("");
}
function renderSectors(){
  const box = document.getElementById("sectors");
  box.innerHTML = SECTORS[state.region].map(s => `<button class="choice" data-sector="${s}">${s}</button>`).join("");
}
function renderPicks(){
  const rows = sortRows(filtered());
  const bar = document.getElementById("sortbar");
  const longKey = rows.some(x => x.year != null) ? "year" : "month";
  const keys = [["pe","P/E"],["week",t("week")],[longKey, longKey==="year"?t("year"):t("month")],["margin",t("margin")],["rev",t("rev")]];
  bar.innerHTML = keys.map(([k,lab]) => {
    const on = state.sort===k;
    const arrow = on ? (state.dir===1?" ↑":" ↓") : "";
    return `<button class="${on?"on":""}" data-sort="${k}">${lab}${arrow}</button>`;
  }).join("");
  crumbs(document.querySelector("#s-pick .crumbs"), " · " + rows.length);
  const box = document.getElementById("picks");
  if(!rows.length){ box.innerHTML = `<p class="empty">${t("empty")}</p>`; return; }
  box.innerHTML = rows.map(x => `
    <article class="card">
      <div class="ticker">${x.ticker}</div>
      <div class="name">${x.name} · ${x.exchangeName} · P/E ${fmt(x.pe)}</div>
      <div class="price">${fmt(x.price,2)} <small style="font-size:14px;letter-spacing:.12em;color:#8a8a8a">${x.ccy||""}</small></div>
      <div class="rets">${t("week")} ${pct(x.week)} &nbsp;·&nbsp; ${x.year!=null ? t("year")+" "+pct(x.year) : t("month")+" "+pct(x.month)}</div>
      <div class="fund">
        <h3>${t("fund")} · ${x.q || "—"}</h3>
        <div class="cols">
          <div><span>${t("margin")}</span>${x.margin==null?"—":fmt(x.margin)+ " %"}</div>
          <div></div>
          <div><span>${t("assets")}</span>${x.assets==null?"—":fmt(x.assets)+" mld."}</div>
          <div><span>${t("debt")}</span>${x.debt==null?"—":fmt(x.debt)+" mld."}</div>
          <div><span>${t("rev")}</span>${x.rev==null?"—":fmt(x.rev)+" mld."}</div>
          <div><span>${t("ni")}</span>${x.ni==null?"—":fmt(x.ni)+" mld."}</div>
        </div>
      </div>
      ${x.alt ? `<div class="alt">${t("alt")} · ${x.alt.ticker} · ${x.alt.exchangeName}</div>` : ""}
    </article>`).join("");
}

document.getElementById("langs").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if(!b) return;
  lang = b.dataset.lang; renderLangs();
  document.getElementById("t-region").textContent = t("region");
  document.getElementById("mode-hq").textContent = t("hq");
  document.getElementById("mode-ex").textContent = t("ex");
  if(state.sector) renderPicks();
});
document.querySelectorAll("[data-region]").forEach(b => b.onclick = () => {
  state.region = b.dataset.region; show("pe");
  crumbs(document.querySelector("#s-pe .crumbs"));
});
document.getElementById("mode-hq").onclick = () => {
  state.mode = "hq";
  document.getElementById("mode-hq").classList.add("on");
  document.getElementById("mode-ex").classList.remove("on");
};
document.getElementById("mode-ex").onclick = () => {
  state.mode = "exchange";
  document.getElementById("mode-ex").classList.add("on");
  document.getElementById("mode-hq").classList.remove("on");
};
document.querySelectorAll("[data-pe]").forEach(b => b.onclick = () => {
  state.pe = b.dataset.pe; renderSectors(); show("sec");
  crumbs(document.querySelector("#s-sec .crumbs"));
});
document.getElementById("sectors").addEventListener("click", e => {
  const b = e.target.closest("[data-sector]"); if(!b) return;
  state.sector = b.dataset.sector; state.sort = "pe"; state.dir = 1;
  renderPicks(); show("pick");
});
document.getElementById("sortbar").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if(!b) return;
  if(state.sort === b.dataset.sort) state.dir *= -1;
  else { state.sort = b.dataset.sort; state.dir = 1; }
  renderPicks();
});
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => {
  const to = b.dataset.back;
  if(to==="region") show("region");
  if(to==="pe") show("pe");
  if(to==="sec") show("sec");
}));

renderLangs();
</script>
</body>
</html>
